<!DOCTYPE html>

<style>
        .glass-panel {
            background: rgba(253, 249, 238, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(193, 201, 190, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Pattern/Graphic (Subtle) -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
<div class="absolute -top-1/4 -right-1/4 w-3/4 h-3/4 bg-primary-container rounded-full blur-[120px] opacity-20"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-3/4 h-3/4 bg-secondary-container rounded-full blur-[120px] opacity-20"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-margin z-10 relative relative min-h-[100dvh]">
<div class="w-full max-w-md w-full mx-auto flex flex-col justify-center">
<!-- Header Section -->
<div class="text-center mb-xl">
<div class="inline-flex justify-center items-center w-20 h-20 bg-surface-container-highest rounded-2xl mb-md shadow-sm border border-outline-variant overflow-hidden">
<!-- Logo Image -->
<img alt="Mertha Logo" class="w-full h-full object-cover" src="/assets/asset_4.png"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm tracking-tight">Selamat Datang Kembali</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lanjutkan perjalanan Anda menyelamatkan makanan hari ini.</p>
</div>
<!-- Login Form Card -->
<div class="glass-panel rounded-xl shadow-lg p-lg sm:p-xl w-full">
<form action="#" class="space-y-md" method="POST">
<!-- Email Input -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none placeholder-outline" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary hover:underline transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none placeholder-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me (Optional) -->
<div class="flex items-center pt-xs">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember-me">Ingat saya</label>
</div>
<!-- Primary Action -->
<div class="pt-sm">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                            Masuk
                        </button>
</div>
</form>
<!-- Divider -->
<div class="mt-lg relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface text-label-sm font-label-sm text-outline">ATAU LANJUTKAN DENGAN</span>
</div>
</div>
<!-- Social Logins -->
<div class="mt-lg grid grid-cols-2 gap-md">
<button class="w-full inline-flex justify-center items-center py-3 px-4 border border-outline-variant rounded-lg bg-surface-container-lowest shadow-sm hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="button">
<svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" fill="#4285F4"></path>
</svg>
<span class="sr-only">Google</span>
</button>
<button class="w-full inline-flex justify-center items-center py-3 px-4 border border-outline-variant rounded-lg bg-surface-container-lowest shadow-sm hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="button">
<svg aria-hidden="true" class="w-5 h-5 text-on-surface" fill="currentColor" viewbox="0 0 24 24">
<path d="M16.365 21.424c-1.579.039-3.138-.475-4.526-1.479-.196-.143-.377-.146-.575-.004-1.393 1.012-2.966 1.523-4.557 1.483-2.067-.052-4.133-1.298-5.35-3.398-2.656-4.593-1.077-10.742 3.42-10.875 1.442-.042 2.843.513 3.993 1.543.204.184.382.181.579-.001 1.045-.968 2.378-1.517 3.731-1.523 1.761-.007 3.393.75 4.542 2.115-2.222 1.341-2.905 4.269-1.503 6.326.837 1.229 2.229 1.953 3.722 1.921-.73 2.126-2.062 3.963-4.004 5.372l-.004.004c-.456.328-.96.536-1.474.524l.006-.008zm-4.707-16.142c-.08-.946.331-1.895.992-2.585.807-.843 1.92-1.353 3.093-1.403.111.97.279 1.956-.372 2.709-.769.887-1.905 1.391-3.09 1.421-.184.005-.367-.044-.543-.141l-.08-.001z"></path>
</svg>
<span class="sr-only">Apple</span>
</button>
</div>
</div>
<!-- Sign Up Link -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Belum punya akun? 
                    <a class="font-label-md text-label-md text-primary font-bold hover:text-secondary transition-colors hover:underline" href="#">Daftar sekarang</a>
</p>
</div>
</div>
</main>
</body></html>
