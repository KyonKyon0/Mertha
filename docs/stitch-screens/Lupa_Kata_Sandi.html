<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-margin">

<img alt="Mertha Logo" class="h-24 w-auto object-contain" src="/assets/asset_3.png"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Lupa Kata Sandi?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm">
                Masukkan email Anda untuk menerima instruksi pemulihan kata sandi.
            </p>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-lg bg-surface-container-lowest p-lg rounded-xl shadow-[0px_8px_24px_rgba(32,78,43,0.15)] border border-outline-variant/30 w-full" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full h-[48px] pl-[48px] pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all placeholder:text-outline/70" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="h-[48px] w-full bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center justify-center gap-sm mt-sm" type="submit">
<span>Kirim Instruksi</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="text-center mt-md">

<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
